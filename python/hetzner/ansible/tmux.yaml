---
- name: Install tmux on Ubuntu
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install tmux
      apt:
        name: tmux
        state: present

    - name: Verify tmux installation
      command: tmux -V
      register: tmux_version
      changed_when: false

    - name: Display tmux version
      debug:
        var: tmux_version.stdout
